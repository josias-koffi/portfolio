<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% if page.title %}{% capture page_title %}{{ page.title }} — {{ site.title }}{% endcapture %}{% else %}{% capture page_title %}{{ site.title }} — {{ site.data.profile.role }}{% endcapture %}{% endif %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page.tagline | default: page.description | default: site.description | strip_html | strip }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page.tagline | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ page.cover | default: site.data.profile.portrait | absolute_url }}">
{% if site.staging %}<meta name="robots" content="noindex, nofollow">{% endif %}
<meta name="theme-color" content="#F4F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238A1C33'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-style='italic' font-size='40' fill='%23F4F1EA'%3EJ%3C/text%3E%3C/svg%3E">
